<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>Lingee Prototype</title>
    <link rel="icon" type="image/png" href="/favicon-96x96-v3.png" sizes="96x96" />
    <meta name="theme-color" content="#F8F7F7" />
    <script>
      ;(function () {
        var scheme = localStorage.getItem("kcode-color-scheme") || "system"
        var dark = scheme === "dark" || (scheme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.dataset.theme = "nova"
        document.documentElement.dataset.colorScheme = dark ? "dark" : "light"
      })()
    </script>
  </head>
  <body class="antialiased overscroll-none text-12-regular overflow-hidden">
    <div id="root" class="flex flex-col h-dvh"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
